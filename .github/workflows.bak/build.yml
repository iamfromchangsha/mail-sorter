name: Build Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install flet pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name "MailSorter" main.py --collect-all flet
          ls -la dist/

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MailSorter-Windows
          path: dist/MailSorter.exe
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/altkdewiki/android-sdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install web dependencies
        run: |
          flutter config --enable-android
          flutter doctor --android-licenses || true

      - name: Build APK (Web version as fallback)
        run: |
          flutter pub get
          flutter build web --release
          ls -la build/web/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MailSorter-Android-Web
          path: build/web/
          retention-days: 30

  release:
    name: Create Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: MailSorter-Windows
          path: artifacts/

      - name: Download Web
        uses: actions/download-artifact@v4
        with:
          name: MailSorter-Android-Web
          path: artifacts/web/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
