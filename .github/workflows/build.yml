name: Build Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install flet pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name "MailSorter" main.py --collect-all flet

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MailSorter-Windows-EXE
          path: dist/MailSorter.exe
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Set up Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install Flet CLI
        run: |
          pip install flet

      - name: Create Flet app
        run: |
          flet create mail-sorter-web ./web_build

      - name: Replace with our app
        run: |
          cp main.py web_build/main.py
          mkdir -p web_build/src
          cp -r src/* web_build/src/
          cp requirements.txt web_build/

      - name: Build APK
        run: |
          cd web_build
          flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MailSorter-Android-APK
          path: web_build/build/android/
          retention-days: 30

  release:
    name: Create Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: MailSorter-Windows-EXE
          path: artifacts/

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: MailSorter-Android-APK
          path: artifacts/android/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
