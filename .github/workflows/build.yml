name: Build Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install flet pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name "MailSorter" main.py --collect-all flet

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MailSorter-Windows-EXE
          path: dist/MailSorter.exe
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install Flet CLI
        run: |
          pip install flet

      - name: Create Flet app
        run: |
          flet create web mail-sorter-app
          ls -la

      - name: Replace with our app
        run: |
          cp main.py mail-sorter-app/main.py
          mkdir -p mail-sorter-app/src
          cp -r src/* mail-sorter-app/src/
          cp requirements.txt mail-sorter-app/

      - name: Build APK
        run: |
          cd mail-sorter-app
          flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MailSorter-Android-APK
          path: mail-sorter-app/build/android/
          retention-days: 30

  release:
    name: Create Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: MailSorter-Windows-EXE
          path: artifacts/
          continue-on-error: true

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: MailSorter-Android-APK
          path: artifacts/android/
          continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
